<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Outil Commerçant PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --bg:#f2f2f2;
    --card:#ffffff;
    --text:#000;
    --primary:#1e88e5;
    --success:#43a047;
    --danger:#e53935;
}
body.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#fff;
}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}
.container{
    max-width:420px;
    margin:auto;
    padding:20px;
}
.card{
    background:var(--card);
    padding:20px;
    border-radius:16px;
    box-shadow:0 15px 30px rgba(0,0,0,.2);
    margin-bottom:20px;
}
h2{text-align:center;margin-top:0}
input,button{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:8px;
}
button{
    border:none;
    cursor:pointer;
}
.row{display:flex;gap:8px}
.primary{background:var(--primary);color:#fff}
.success{background:var(--success);color:#fff}
.danger{background:var(--danger);color:#fff}
.badge{
    padding:6px;
    border-radius:8px;
    margin-top:5px;
}
.ok{background:#c8e6c9}
.warn{background:#fff9c4}
.bad{background:#ffcdd2}
.clear{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}
.input-wrap{position:relative}
.toggle{
    text-align:center;
    cursor:pointer;
    margin-bottom:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="toggle" onclick="toggleTheme()">🌙 / 🌞 Mode</div>

<!-- TVA -->
<div class="card">
<h2>🧾 TVA</h2>
<div class="input-wrap">
<input id="tvaPrice" type="number" placeholder="Prix">
<span class="clear" onclick="clearInput('tvaPrice')">❌</span>
</div>
<div class="row">
<button onclick="calcTVA(0.055)">5,5%</button>
<button onclick="calcTVA(0.10)">10%</button>
<button onclick="calcTVA(0.20)" class="primary">20%</button>
</div>
<div id="tvaResult"></div>
</div>

<!-- PRIX DE REVENTE -->
<div class="card">
<h2>💸 Prix de revente</h2>
<input id="buy" type="number" placeholder="Prix d'achat">
<input id="margin" type="number" placeholder="Marge %">
<button class="success" onclick="calcResale()">Calculer</button>
<div id="resaleResult"></div>
</div>

<!-- DLC -->
<div class="card">
<h2>📅 DLC</h2>
<input id="product" placeholder="Nom du produit">
<input id="dlc" type="date">
<button class="primary" onclick="addDLC()">Ajouter</button>
<div id="dlcList"></div>
</div>

</div>

<script>
function toggleTheme(){
    document.body.classList.toggle("dark");
}

function clearInput(id){
    document.getElementById(id).value="";
}

function calcTVA(rate){
    const p=parseFloat(tvaPrice.value);
    if(!p)return;
    const tva=p*rate;
    tvaResult.innerHTML=`
    HT : ${p.toFixed(2)} €<br>
    TVA (${rate*100}%) : ${tva.toFixed(2)} €<br>
    TTC : ${(p+tva).toFixed(2)} €
    `;
}

function calcResale(){
    const buy=parseFloat(document.getElementById("buy").value);
    const margin=parseFloat(document.getElementById("margin").value);
    if(!buy||!margin)return;
    const sell=buy*(1+margin/100);
    resaleResult.innerHTML=`
    Prix de vente : <b>${sell.toFixed(2)} €</b><br>
    Bénéfice : ${(sell-buy).toFixed(2)} €
    `;
}

function addDLC(){
    const name=product.value;
    const date=new Date(dlc.value);
    if(!name||!date)return;
    const days=Math.ceil((date-new Date())/86400000);
    let cls="ok", txt="OK";
    if(days<=7){cls="warn";txt="À écouler";}
    if(days<0){cls="bad";txt="Périmé";}
    const div=document.createElement("div");
    div.className="badge "+cls;
    div.innerHTML=`${name} – ${days} jours – <b>${txt}</b>`;
    dlcList.appendChild(div);
}
</script>

</body>
</html>
